name: Django upgrade report
author: Daniel Kurdoghlian, Pushing Pixels
description: Which of your dependencies block a Django upgrade, and in which order to upgrade them.
branding:
  icon: arrow-up-circle
  color: green

inputs:
  path:
    description: Project directory with a lockfile, requirements*.txt or pyproject.toml.
    default: "."
  target:
    description: "Django version to upgrade to: 'auto' (the newest LTS above your Django, or the newest release when no LTS is above it), 'lts', 'latest' or e.g. '5.2'."
    default: auto
  framework:
    description: "What to plan the upgrade of: 'django', or 'wagtail' or 'django-cms', whose packages are then checked against target and from of that framework."
    default: django
  via:
    description: "'lts' plans the way to the target in steps, one report per LTS on the way; 'each' one per feature version. Empty: one report. The counts are summed over the steps. Does not go with baseline."
    default: ""
  from:
    description: "The Django version you run today, e.g. '4.2', when your requirements only give a range. Empty reads it from the project."
    default: ""
  fail-on:
    description: "Fail the step when a package is 'blocked', needs an 'upgrade' or a 'check'. Empty never fails."
    default: ""
  comment:
    description: "'true' puts the report on the pull request as one comment, updated on every push; 'on-change' updates it only when a status or step changed. Needs permissions: pull-requests: write. Default 'false'."
    default: "false"
  issue:
    description: "'true' keeps one open issue per target with the plan as a task list: ticks stay, what needs nothing any more is ticked off. Needs permissions: issues: write. Default 'false'."
    default: "false"
  comment-key:
    description: "Tells comments apart when the action runs more than once for one path in a pull request, e.g. in a matrix. Default: the path."
    default: ""
  baseline:
    description: "Path to an earlier JSON report (the report output of a previous run). The summary then starts with what changed since. A missing file is skipped, so the first run works too."
    default: ""
  fail-on-change:
    description: "With baseline: fail the step when 'any'thing changed, or when something is 'worse'. Empty never fails."
    default: ""
  python-target:
    description: "Also check every dependency on this Python: 'auto' (when the target Django needs a newer one than your project uses), 'none' or e.g. '3.12'."
    default: auto
  fail-on-python:
    description: "Fail the step when a dependency is 'blocked', needs an 'upgrade' or a 'check' on that Python. Empty never fails."
    default: ""
  evidence:
    description: "'true' looks for signs of support for packages to check in their public GitHub repositories (the test matrix on the default branch). Sends those repository names to GitHub."
    default: "false"
  check-private-on-pypi:
    description: "'true' looks up packages your project installs from another index on PyPI, too: for an index that mirrors PyPI (Artifactory, Nexus, devpi). Their names are sent to PyPI."
    default: "false"

outputs:
  report:
    description: Path to the JSON report. Unique per use of the action, so two uses in one job keep both.
    value: ${{ steps.report.outputs.report }}
  blocked:
    description: Number of blocked packages.
    value: ${{ steps.report.outputs.blocked }}
  upgrade:
    description: Number of packages to upgrade.
    value: ${{ steps.report.outputs.upgrade }}
  check:
    description: Number of packages to check manually.
    value: ${{ steps.report.outputs.check }}
  ready:
    description: Number of ready packages.
    value: ${{ steps.report.outputs.ready }}
  changes:
    description: Number of changes since the baseline, empty without one.
    value: ${{ steps.report.outputs.changes }}
  python-blocked:
    description: Number of dependencies no release of which runs on the newer Python, 0 when there is none to check.
    value: ${{ steps.report.outputs.python-blocked }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        update-environment: false
      id: python
    # Release metadata never changes, so later runs only fetch what is new.
    - uses: actions/cache@v6
      with:
        path: ~/.cache/django-upgrade-report
        key: django-upgrade-report-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: django-upgrade-report-${{ runner.os }}-
    - name: Install django-upgrade-report
      id: install
      shell: bash
      env:
        DUR_PYTHON: ${{ steps.python.outputs.python-path }}
      run: |
        temp="$RUNNER_TEMP"
        if [ "$RUNNER_OS" = Windows ]; then
          scripts=Scripts
          temp="$(cygpath -m "$RUNNER_TEMP")"  # D:/a/_temp: works for bash and Python alike
        else
          scripts=bin
        fi
        venv="$temp/dur"
        "$DUR_PYTHON" -m venv "$venv"
        "$venv/$scripts/python" -m pip install --quiet --disable-pip-version-check "$GITHUB_ACTION_PATH"
        echo "bin=$venv/$scripts" >> "$GITHUB_OUTPUT"
    - name: Report
      id: report
      shell: bash
      env:
        DUR_BIN: ${{ steps.install.outputs.bin }}
        DUR_PATH: ${{ inputs.path }}
        DUR_TARGET: ${{ inputs.target }}
        DUR_FRAMEWORK: ${{ inputs.framework }}
        DUR_FAIL_ON: ${{ inputs.fail-on }}
        DUR_FROM: ${{ inputs.from }}
        DUR_VIA: ${{ inputs.via }}
        DUR_CHECK_PRIVATE: ${{ inputs.check-private-on-pypi }}
        DUR_EVIDENCE: ${{ inputs.evidence }}
        DUR_PYTHON_TARGET: ${{ inputs.python-target }}
        DUR_BASELINE: ${{ inputs.baseline }}
        DUR_COMMENT: ${{ inputs.comment }}
        DUR_COMMENT_KEY: ${{ inputs.comment-key }}
        DUR_ISSUE: ${{ inputs.issue }}
        DUR_TOKEN: ${{ github.token }}
        DUR_FAIL_ON_CHANGE: ${{ inputs.fail-on-change }}
        DUR_FAIL_ON_PYTHON: ${{ inputs.fail-on-python }}
        PYTHONUTF8: "1"
      run: |
        dur() { "$DUR_BIN/python" -m django_upgrade_report "$@"; }
        report="$("$DUR_BIN/python" -c 'import os, tempfile; print(tempfile.mkdtemp(prefix="django-upgrade-report-", dir=os.environ["RUNNER_TEMP"]).replace(os.sep, "/"))')/report.json"
        common=("$DUR_PATH" --framework "${DUR_FRAMEWORK:-django}" --target "$DUR_TARGET" --python-target "$DUR_PYTHON_TARGET")
        if [ -n "$DUR_FROM" ]; then common+=(--from "$DUR_FROM"); fi
        if [ "$DUR_CHECK_PRIVATE" = true ]; then common+=(--check-private-on-pypi); fi
        if [ "$DUR_EVIDENCE" = true ]; then common+=(--evidence); fi
        if [ -n "$DUR_VIA" ]; then
          common+=(--via "$DUR_VIA")
          if [ -n "$DUR_BASELINE" ]; then
            echo "::warning::django-upgrade-report: baseline does not go with via, it is left out"
            DUR_BASELINE=""
          fi
        fi
        if [ -n "$DUR_BASELINE" ] && [ -f "$DUR_BASELINE" ]; then common+=(--baseline "$DUR_BASELINE"); fi
        # The first run fills the cache, the others read from it.
        dur "${common[@]}" --format json -o "$report"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        "$DUR_BIN/python" - "$report" >> "$GITHUB_OUTPUT" <<'PY'
        import json, sys
        sys.stdout.reconfigure(newline="\n")  # no \r in the outputs on Windows
        with open(sys.argv[1], encoding="utf-8") as f:
            data = json.load(f)
        steps = data["steps"] if data.get("kind") == "path" else [data]  # --via: summed
        for status in data.get("counts") or steps[0]["counts"]:
            print(f"{status}={sum(step['counts'][status] for step in steps)}")
        python = [p for step in steps for p in (step.get("python") or {}).get("packages", [])]
        print(f"python-blocked={sum(p['status'] == 'blocked' for p in python)}")
        changes = data.get("changes")
        print(f"changes={len(changes['items']) if changes else ''}")
        PY
        markdown="${report%.json}.md"
        dur "${common[@]}" --format markdown -o "$markdown"
        cat "$markdown" >> "$GITHUB_STEP_SUMMARY"
        case "$DUR_COMMENT" in
          true|on-change)
            comment=(--report "$report" --markdown "$markdown" --key "${DUR_COMMENT_KEY:-$DUR_PATH}")
            if [ "$DUR_COMMENT" = on-change ]; then comment+=(--on-change); fi
            # Only this command gets the token.
            GITHUB_TOKEN="$DUR_TOKEN" "$DUR_BIN/python" -m django_upgrade_report.ci comment "${comment[@]}"
            ;;
          false|"") ;;
          *) echo "::warning::django-upgrade-report: comment is '$DUR_COMMENT', expected true, on-change or false" ;;
        esac
        case "$DUR_ISSUE" in
          true)
            GITHUB_TOKEN="$DUR_TOKEN" "$DUR_BIN/python" -m django_upgrade_report.ci issue --report "$report" --key "${DUR_COMMENT_KEY:-$DUR_PATH}"
            ;;
          false|"") ;;
          *) echo "::warning::django-upgrade-report: issue is '$DUR_ISSUE', expected true or false" ;;
        esac
        # Last, so the summary and outputs exist even when this fails the step.
        args=()
        if [ -n "$DUR_FAIL_ON" ]; then args+=(--fail-on "$DUR_FAIL_ON"); fi
        if [ -n "$DUR_FAIL_ON_PYTHON" ]; then args+=(--fail-on-python "$DUR_FAIL_ON_PYTHON"); fi
        if [ -n "$DUR_FAIL_ON_CHANGE" ] && [ -n "$DUR_BASELINE" ] && [ -f "$DUR_BASELINE" ]; then
          args+=(--fail-on-change "$DUR_FAIL_ON_CHANGE")
        fi
        dur "${common[@]}" "${args[@]}"
