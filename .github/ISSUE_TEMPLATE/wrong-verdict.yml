name: Wrong verdict
description: A package is reported as blocked, ready or upgradable when it should not be.
labels: ["verdict"]
body:
  - type: markdown
    attributes:
      value: Thanks! Wrong verdicts usually come from packaging metadata nobody anticipated, so real examples are gold.
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: django-storages 1.14.2
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Current Django version and target
      placeholder: 4.2.7 → 5.2
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What the tool says
      description: >-
        Paste the output of `django-upgrade-report --explain PACKAGE` (run it the way you ran
        the report, with the same target). It names the tool version, every rule it applied and
        every release it looked at. On versions before 0.5, paste the line from the report or
        the package's entry from `--format json`.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and why
      description: A link to the changelog, release notes or PyPI page helps a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: django-upgrade-report version
      description: Already in the `--explain` output; needed only if you could not run it.
      placeholder: output of django-upgrade-report --version
    validations:
      required: false
