name: Feature request
description: An idea for a new check, source format or output.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you trying to find out or do when the tool fell short?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would you like it to work? Example output is welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
