name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --group dev pytest --cov=django_upgrade_report --cov-report=term-missing

  # Catches encoding and path bugs that only show up on Windows.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv run --group dev pytest

  # Runs -i with Textual's Pilot: the whole suite with the tui extra, the other jobs without.
  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --group dev --with textual pytest

  # Runs the script of the HTML report in Chromium.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --group dev --with playwright playwright install --with-deps chromium
      - run: uv run --group dev --with playwright pytest -m browser

  # Builds the package and checks that the README renders on PyPI.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      # The HTML report reads its script from the package.
      - run: unzip -l dist/*.whl | grep -q django_upgrade_report/render/html_report.js
      - run: unzip -l dist/*.whl | grep -q django_upgrade_report/data/django_removals.json
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Runs the action against a small project, against the real PyPI. Windows takes the
  # Scripts/ and drive-letter paths through the action's bash steps.
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          printf 'Django==4.2.7\ndjango-debug-toolbar==4.2.0\ndjango-filter==23.3\n' \
            > "$RUNNER_TEMP/demo/requirements.txt"
      - uses: ./
        id: report
        with:
          path: ${{ runner.temp }}/demo
      - name: Check the outputs
        shell: bash
        env:
          REPORT: ${{ steps.report.outputs.report }}
          READY: ${{ steps.report.outputs.ready }}
        run: |
          test -s "$REPORT"
          test -n "$READY"
