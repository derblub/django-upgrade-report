[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-upgrade-report"
version = "0.1.0"
description = "Find out which of your dependencies block a Django upgrade, and in which order to upgrade them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Kurdoghlian", email = "daniel@pushingpixels.at" }]
maintainers = [{ name = "Daniel Kurdoghlian", email = "daniel@pushingpixels.at" }]
requires-python = ">=3.10"
dependencies = [
  "packaging>=23",
  "tomli>=2; python_version < '3.11'",
]
keywords = ["django", "upgrade", "dependencies", "compatibility", "lts", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/derblub/django-upgrade-report"
Issues = "https://github.com/derblub/django-upgrade-report/issues"
"Pushing Pixels" = "https://pushingpixels.at"
"Django upgrade audit" = "https://pushingpixels.at/creates/django-upgrades"

[project.scripts]
django-upgrade-report = "django_upgrade_report.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/django_upgrade_report"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
