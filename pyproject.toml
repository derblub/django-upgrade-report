[build-system]
# hatchling 1.32 writes Metadata-Version 2.5, which twine check (and so the PyPI upload
# action) rejects. Lift the cap once twine accepts it.
requires = ["hatchling>=1.27,<1.32", "hatch-fancy-pypi-readme>=22.5"]
build-backend = "hatchling.build"

[project]
name = "django-upgrade-report"
version = "0.2.4"
description = "Which of your dependencies block a Django upgrade, and in which order to upgrade them."
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Kurdoghlian", email = "daniel@pushingpixels.at" }]
maintainers = [{ name = "Daniel Kurdoghlian", email = "daniel@pushingpixels.at" }]
requires-python = ">=3.10"
dependencies = [
  "packaging>=23",
  "tomli>=2; python_version < '3.11'",
]
keywords = [
  "django",
  "upgrade",
  "dependencies",
  "compatibility",
  "lts",
  "migration",
  "requirements",
  "lockfile",
  "ci",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/derblub/django-upgrade-report"
Documentation = "https://github.com/derblub/django-upgrade-report#readme"
Repository = "https://github.com/derblub/django-upgrade-report"
Changelog = "https://github.com/derblub/django-upgrade-report/blob/main/CHANGELOG.md"
Issues = "https://github.com/derblub/django-upgrade-report/issues"
"Pushing Pixels" = "https://pushingpixels.at"
"Django upgrade audit" = "https://pushingpixels.at/creates/django-upgrades"

[project.scripts]
django-upgrade-report = "django_upgrade_report.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/django_upgrade_report"]

[tool.hatch.build.targets.sdist]
exclude = ["/docs", "/.github"]

# PyPI renders the README, but cannot resolve paths relative to the repository.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(?!https?://)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/derblub/django-upgrade-report/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="#([^"]+)"'
replacement = 'href="https://github.com/derblub/django-upgrade-report#\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|mailto:)([^"]+)"'
replacement = 'href="https://github.com/derblub/django-upgrade-report/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/derblub/django-upgrade-report/blob/main/\1)'

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["django_upgrade_report"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
