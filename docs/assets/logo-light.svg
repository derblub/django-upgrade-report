<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 14 55 37" width="110" height="74" role="img" aria-label="Pushing Pixels">
  <!-- The Pushing Pixels mark, resting state: the pushed pixel sits outside its slot. -->
  <defs>
    <linearGradient id="push" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect x="26" y="17" width="13" height="13" rx="2" fill="none" stroke="#1d1d20" stroke-width="2" stroke-dasharray="3 3" stroke-opacity=".45"/>
  <rect x="7" y="16" width="15" height="15" rx="3" fill="#1d1d20"/>
  <rect x="7" y="34" width="15" height="15" rx="3" fill="#1d1d20"/>
  <rect x="25" y="34" width="15" height="15" rx="3" fill="#1d1d20"/>
  <rect x="43" y="16" width="15" height="15" rx="3" fill="url(#push)"/>
</svg>
